<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#090d16">
<title>XenvitalTech AI — ShashwatBytes</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#718096;--border:#e4e8f0;--primary:#5b5ff7;--bot:#eef1f7;--danger:#ef4444}
body.dark{--bg:#090d16;--card:#111827;--text:#f5f7ff;--muted:#9ca8bb;--border:#263244;--bot:#1c2635}
html,body{width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--text)}
button,input{font:inherit}button{cursor:pointer}
.auth{height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.auth-card{width:100%;max-width:430px;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:30px;box-shadow:0 20px 60px #0002}
.auth-logo{width:90px;height:90px;border-radius:22px;display:block;margin:auto;object-fit:cover}
h1{text-align:center;margin-top:18px}.sub{text-align:center;color:var(--muted);font-size:13px;margin:8px 0 25px}
.form{display:none}.form.active{display:block}label{display:block;font-size:12px;font-weight:bold;margin:14px 0 7px}
input{width:100%;padding:13px;border:1px solid var(--border);border-radius:11px;outline:0;background:var(--bg);color:var(--text)}
.primary{width:100%;border:0;padding:13px;margin-top:20px;border-radius:11px;background:linear-gradient(135deg,#5b5ff7,#7c3aed);color:#fff;font-weight:bold}
.switch{text-align:center;margin-top:18px;font-size:13px;color:var(--muted)}.switch span{color:var(--primary);cursor:pointer;font-weight:bold}.error{color:var(--danger);font-size:12px;margin-top:10px}
.app{display:none;width:100%;height:100dvh}.sidebar{width:275px;flex:none;background:var(--card);border-right:1px solid var(--border);padding:18px;display:flex;flex-direction:column}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:22px}.logo{width:43px;height:43px;border-radius:13px;object-fit:cover}.brand small{color:var(--muted)}
.new-chat,.search-btn,.chat-btn{border:0;background:var(--primary);color:white;border-radius:11px}.new-chat{padding:12px;font-weight:bold;margin-bottom:18px}
.nav-title{color:var(--muted);font-size:11px;text-transform:uppercase;margin:10px 4px}.nav-btn{width:100%;padding:12px;background:transparent;color:var(--text);border:0;border-radius:10px;text-align:left;margin-bottom:4px}.nav-btn.active,.nav-btn:hover{background:var(--bot)}
.sidebar-bottom{margin-top:auto;border-top:1px solid var(--border);padding-top:10px}.profile-mini{display:flex;align-items:center;gap:10px;padding:10px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#5b5ff7,#7c3aed);font-weight:bold;flex:none}
.profile-mini span{display:block;color:var(--muted);font-size:11px}.logout{width:100%;padding:10px;border:0;background:transparent;color:var(--danger);text-align:left}
.main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}.topbar{height:65px;flex:none;padding:0 20px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.top-actions{display:flex;gap:8px}.icon{width:38px;height:38px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);position:relative}.badge{display:none;position:absolute;right:-5px;top:-5px;background:#ef4444;color:#fff;border-radius:12px;min-width:18px;height:18px;font-size:10px;align-items:center;justify-content:center;border:2px solid var(--card)}
.panel{display:none;position:fixed;right:20px;top:72px;width:320px;max-width:calc(100vw - 20px);background:var(--card);border:1px solid var(--border);border-radius:15px;box-shadow:0 15px 45px #0003;z-index:500;overflow:hidden}.panel.show{display:block}.panel h3{padding:14px;border-bottom:1px solid var(--border)}
.notice{padding:13px;border-bottom:1px solid var(--border);cursor:pointer}.notice small{display:block;color:var(--muted);margin-top:4px}.none{padding:28px;text-align:center;color:var(--muted)}
.view{display:none;flex:1;min-height:0;overflow:hidden}.view.active{display:flex;flex-direction:column}.scroll{flex:1;overflow-y:auto;padding:25px 20px}.messages{max-width:850px;margin:auto}.message{display:flex;gap:10px;margin:18px 0}.message.user{flex-direction:row-reverse}.bubble{max-width:75%;padding:12px 15px;border-radius:14px;line-height:1.55;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.bot .bubble{background:var(--bot)}.user .bubble{background:var(--primary);color:white}
.input-area{padding:12px 20px 18px;border-top:1px solid var(--border);background:var(--card)}.input-box{max-width:850px;margin:auto;display:flex;gap:8px}.input-box input{flex:1}.send{width:48px;border:0;border-radius:11px;background:var(--primary);color:#fff}
.friends{padding:30px;overflow:auto}.search-box{max-width:650px;display:flex;gap:8px;margin-top:20px}.search-box input{flex:1}.search-btn{padding:0 18px}.friend-result{max-width:650px;margin-top:18px;padding:15px;background:var(--card);border:1px solid var(--border);border-radius:14px;display:flex;justify-content:space-between;align-items:center}.friend-info{display:flex;gap:10px;align-items:center}.chat-btn{padding:9px 14px}
.private-head{height:60px;display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--card)}.private-msg{flex:1;overflow:auto;padding:20px}.private-input{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--border);background:var(--card)}.private-input input{flex:1}
.profile-logout{margin-top:25px;padding:12px;border:0;border-radius:11px;background:#ef44441a;color:var(--danger);font-weight:bold}.mobile-nav{display:none}
@media(max-width:750px){
.sidebar{display:none}.topbar{height:58px;padding:0 12px}.main{padding-bottom:70px}.mobile-nav{display:flex;position:fixed;z-index:200;bottom:0;left:0;right:0;height:70px;background:var(--card);border-top:1px solid var(--border)}.mobile-nav button{flex:1;border:0;background:transparent;color:var(--muted)}.mobile-nav button.active{color:var(--primary);background:var(--bot)}
.scroll{padding:15px 12px 85px}.bubble{max-width:84%}.input-area{position:fixed;left:0;right:0;bottom:70px;height:70px;padding:9px 10px;z-index:150}.input-box{height:52px}.input-box input{font-size:16px}.send{width:52px}.private-input{position:fixed;left:0;right:0;bottom:70px;height:70px;z-index:150;padding:9px 10px}.private-input input{font-size:16px}.private-msg{padding-bottom:85px}.friends{padding:20px 13px}.auth-card{padding:24px}.panel{right:10px;top:62px;width:calc(100vw - 20px)}
}
</style>
</head>
